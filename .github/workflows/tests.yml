name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq build-essential libgsl-dev bedtools mummer samtools
      - name: Install python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt matplotlib seaborn
      - name: Fetch integration test data
        run: |
          wget https://github.com/BinPro/integration_test_data/archive/v1.0.tar.gz
          mkdir tests/test_data/integration_test_data
          tar -xzf v1.0.tar.gz -C tests/test_data/integration_test_data --strip-components=1
      - name: Install CONCOCT
        run: pip install .
      - name: Run tests
        run: pytest
